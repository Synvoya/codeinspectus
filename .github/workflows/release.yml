name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish-npm:
    name: verify signed tag and publish npm with provenance
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an annotated, GitHub-verified release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          test "$(jq -r '.object.type' <<<"$ref_json")" = "tag" || {
            echo "Release tag must be annotated and signed; lightweight tags are rejected."
            exit 1
          }
          tag_url="$(jq -r '.object.url' <<<"$ref_json")"
          tag_json="$(gh api "$tag_url")"
          test "$(jq -r '.verification.verified' <<<"$tag_json")" = "true" || {
            echo "Release tag signature is not verified by GitHub."
            jq -r '.verification.reason' <<<"$tag_json"
            exit 1
          }

      - name: Require exact tag, package, and checked-out commit alignment
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedTag = `v${pkg.version}`;
          if (process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(`release tag ${process.env.RELEASE_TAG} does not match package ${expectedTag}`);
          }
          const tagCommit = execFileSync("git", ["rev-list", "-n", "1", process.env.RELEASE_TAG], { encoding: "utf8" }).trim();
          const head = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (tagCommit !== head) throw new Error(`tag commit ${tagCommit} does not match checked-out HEAD ${head}`);
          if (pkg.repository?.url !== "git+https://github.com/Synvoya/codeinspectus.git") {
            throw new Error("package repository URL must exactly match the public GitHub repository");
          }
          NODE

      - name: Require npm trusted-publishing-compatible runtime
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          const version = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          const [major, minor] = version.split(".").map(Number);
          if (major < 11 || (major === 11 && minor < 5)) {
            throw new Error(`npm ${version} is too old for trusted publishing; require >=11.5.1`);
          }
          NODE

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run eval
      - run: node scripts/smoke-stdio.mjs
      - run: npm run test:sdk-consumer

      - name: Refuse an existing npm version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "codeinspectus@${version}" version >/dev/null 2>&1; then
            echo "codeinspectus@${version} already exists; refusing to publish."
            exit 1
          fi

      - name: Publish through npm trusted publishing with provenance
        run: npm publish --provenance --access public

      - name: Verify published version and provenance attestation
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          for attempt in $(seq 1 12); do
            published="$(npm view "codeinspectus@${version}" version 2>/dev/null || true)"
            attestation="$(curl -fsSL "https://registry.npmjs.org/-/npm/v1/attestations/codeinspectus@${version}" 2>/dev/null || true)"
            if test "$published" = "$version" && jq -e '.attestations[]? | select(.predicateType == "https://slsa.dev/provenance/v1")' <<<"$attestation" >/dev/null 2>&1; then
              echo "Verified codeinspectus@${version} with npm provenance."
              exit 0
            fi
            sleep 10
          done
          echo "Published version or provenance attestation did not become verifiable."
          exit 1
