# CodeInspectus original Apache-2.0 security ruleset (see LICENSE-PROVENANCE.md). ASCII-only.
# Cross-site scripting (OWASP A03).
# NOTE: a React raw-HTML-sink rule is deferred -- the JSX attribute pattern is not
# reliably expressible as a standalone Opengrep pattern; revisit at weekly intake.
rules:
  - id: ci-baseline-dom-xss-innerhtml
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Writing computed (non-literal) markup into the page through one of these HTML
      sinks lets attacker-controlled input run as script in the DOM (DOM-based XSS).
      Use textContent for plain text, or pass the value through a trusted sanitizer
      (such as DOMPurify) before it reaches the DOM.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    # Precision pass (design 10.6): a sink write alone is not reported. Field triage found the
    # writes overwhelmingly carry escaped, sanitised, same-origin or constant markup, so the written
    # value must now contain a DOM-XSS source: a URL part a link can set (hash, search, href,
    # pathname), the document URL or referrer, window.name, or a postMessage payload inside a
    # message handler, outside a named HTML sanitizer (DOMPurify, sanitize-html, escapeHtml, he). It
    # may reach the sink directly or through one or two variables (URLSearchParams/URL objects) whose
    # assignments do not sanitise, URL-encode or compare it. A plain pattern, not
    # taint mode: taint mode timed out on large hand-written and vendored browser bundles in the
    # field. Markup of other origin (fetched JSON, stored content) is a known gap; a value looked up
    # in a constant table by a URL part (TITLES[location.pathname]) is a known false positive.
    # Speed: Opengrep skips a file that names no sink (innerHTML, outerHTML, insertAdjacentHTML,
    # document.write) only while it can derive that file prefilter from the rule. Each arm's own
    # pattern-inside, metavariable-regex and metavariable-pattern clauses multiply in that analysis; past
    # its limit Opengrep silently drops the prefilter and every pattern below runs on every JS/TS file
    # (baseline Opengrep time x2.7 on the field repos). So arms that differ only in their source share one
    # arm (the location parts are spelled out there), and elsewhere the location-part regex sits inside the
    # $X metavariable-pattern. After editing, `opengrep-core -prefilter_of_rules xss.yaml` must not print
    # "filter":"None" for this rule (eval E136 checks that a file without a sink is never matched).
    patterns:
      - pattern-either:
          # A source written straight into the sink.
          - patterns:
              - pattern-either:
                  - pattern: $EL.innerHTML = $X
                  - pattern: $EL.innerHTML += $X
                  - pattern: $EL.outerHTML = $X
                  - pattern: $EL.insertAdjacentHTML($POS, $X)
                  - pattern: document.write($X)
                  - pattern: document.writeln($X)
              - metavariable-pattern:
                  metavariable: $X
                  pattern-either:
                    - patterns:
                        - pattern-either:
                            - pattern: location.$PART
                            - pattern: $W.location.$PART
                        - metavariable-regex:
                            metavariable: $PART
                            regex: ^(hash|search|href|pathname)$
                        - pattern-not-inside: DOMPurify.sanitize(...)
                        - pattern-not-inside: dompurify.sanitize(...)
                        - pattern-not-inside: purify.sanitize(...)
                        - pattern-not-inside: sanitizeHtml(...)
                        - pattern-not-inside: escapeHtml(...)
                        - pattern-not-inside: he.encode(...)
                        - pattern-not-inside: he.escape(...)
                    - patterns:
                        - pattern-either:
                            - pattern: document.URL
                            - pattern: document.documentURI
                            - pattern: document.baseURI
                            - pattern: document.referrer
                            - pattern: window.name
                        - pattern-not-inside: DOMPurify.sanitize(...)
                        - pattern-not-inside: dompurify.sanitize(...)
                        - pattern-not-inside: purify.sanitize(...)
                        - pattern-not-inside: sanitizeHtml(...)
                        - pattern-not-inside: escapeHtml(...)
                        - pattern-not-inside: he.encode(...)
                        - pattern-not-inside: he.escape(...)
          # One hop: a variable assigned from a source, not sanitised, URL-encoded or compared there.
