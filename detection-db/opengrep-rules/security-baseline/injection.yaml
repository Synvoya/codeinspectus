# CodeInspectus original Apache-2.0 security ruleset (see LICENSE-PROVENANCE.md). ASCII-only.
# Injection classes (OWASP A03): SQLi, command injection, code eval, NoSQL, path traversal.
# The JS/TS SQL injection rule is taint mode and lives in injection-taint.yaml.
rules:
  - id: ci-baseline-sql-injection-python
    languages: [python]
    severity: ERROR
    message: >
      Potential SQL injection: a SQL query is built with string formatting/
      concatenation. Use parameterized queries.
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." % ...)
          - pattern: $CUR.execute("..." + ...)
          - pattern: $CUR.execute(f"...")

  - id: ci-baseline-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Potential command injection: untrusted data is passed to a shell-executing
      API built from a string. Use a process API with an argument array.
    metadata:
      cwe: "CWE-77: Improper Neutralization of Special Elements used in a Command ('Command Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $CP.exec("..." + ...)
          - pattern: $CP.exec(`...${...}...`)
          - pattern: $CP.execSync("..." + ...)
          - pattern: $CP.execSync(`...${...}...`)

  - id: ci-baseline-command-injection-python
    languages: [python]
    severity: ERROR
    message: >
      Potential command injection: a shell command is built from non-literal data
      with shell=True. Pass an argument list and avoid shell=True.
    metadata:
      cwe: "CWE-77: Command Injection"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: subprocess.$F("..." + ..., shell=True)
          - pattern: subprocess.$F(f"...", shell=True)
          - pattern: os.system("..." + ...)
          - pattern: os.system(f"...")

  - id: ci-baseline-dangerous-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Dynamic code evaluation of a non-literal value can lead to code injection.
      Avoid evaluating runtime-constructed code.
    metadata:
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
      - pattern-not: eval("...")
      # Precision pass (design 10.6): a Function built only from string literals (for example the
      # ESM import shim new Function('s', 'return import(s)')) runs author-written code.
      - pattern-not: new Function("...")
      - pattern-not: new Function("...", "...")
      - pattern-not: new Function("...", "...", "...")
      - pattern-not: new Function("...", "...", "...", "...")

  - id: ci-baseline-eval-python
    languages: [python]
    severity: ERROR
    message: >
      Dynamic evaluation of non-literal input can lead to code injection. Avoid
      eval/exec on untrusted data.
    metadata:
      cwe: "CWE-94: Code Injection"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: exec($X)
      - pattern-not: eval("...")
      - pattern-not: exec("...")

  - id: ci-baseline-nosql-injection
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Potential NoSQL injection: a MongoDB-style query filter takes a request body or
      query-string value that can be an object (such as {"$ne": null}). Cast the value to the
      expected type or validate it before it reaches the filter.
    metadata:
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: LOW
    # Precision pass (design 10.6): the field hits were a SQL query builder's find({ id: ... }), not
    # MongoDB. The filter must now belong to a Mongoose-style model (a capitalised receiver) or a
    # driver collection, or sit in a file that imports mongoose or mongodb. Route parameters
    # (req.params) are always strings, so they cannot carry an operator object.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: '$COL.$FIND({ ..., $FIELD: req.$SRC.$NAME, ... }, ...)'
              - metavariable-regex:
                  metavariable: $COL
                  regex: ^[A-Z][A-Za-z0-9_]*$
          - pattern: '$DB.collection(...).$FIND({ ..., $FIELD: req.$SRC.$NAME, ... }, ...)'
          - patterns:
              - pattern: '$COL.$FIND({ ..., $FIELD: req.$SRC.$NAME, ... }, ...)'
              - pattern-either:
                  - pattern-inside: |
                      import $M from "mongoose";
                      ...
                  - pattern-inside: |
                      import { ... } from "mongodb";
                      ...
                  - pattern-inside: |
                      $M = require("mongoose");
                      ...
                  - pattern-inside: |
                      $M = require("mongodb");
                      ...
      - metavariable-regex:
          metavariable: $FIND
          regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|countDocuments|exists)$
      - metavariable-regex:
          metavariable: $SRC
          regex: ^(body|query)$

  - id: ci-baseline-path-traversal
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Potential path traversal: a filesystem path is built from request input.
      Resolve and validate the path against an allowed base directory.
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $FS.readFile($P + ..., ...)
          - pattern: $FS.readFileSync($P + ...)
          - pattern: $FS.createReadStream($P + ...)
      - metavariable-pattern:
          metavariable: $P
          patterns:
            - pattern-either:
                - pattern: req.$ANY.$NAME
                - pattern: $REQ.query
                - pattern: $REQ.params
