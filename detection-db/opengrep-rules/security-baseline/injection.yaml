# CodeInspectus original Apache-2.0 security ruleset (see LICENSE-PROVENANCE.md). ASCII-only.
# Injection classes (OWASP A03): SQLi, command injection, code eval, NoSQL, path traversal.
# The JS/TS SQL injection rule is taint mode and lives in injection-taint.yaml.
rules:
  - id: ci-baseline-sql-injection-python
    languages: [python]
    # 4.1 M9 fresh-set gate (Ruling 3): 1 hit, a false positive (DDL from constants and int()); low severity, low confidence.
    severity: INFO
    message: >
      Potential SQL injection: a SQL query is built with string formatting/
      concatenation. Use parameterized queries.
    metadata:
      cwe: "CWE-89: SQL Injection"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: LOW
    # 4.1 M9: fire only when some interpolated operand is not a constant. A constant is a literal, or an
    # UPPER_SNAKE name assigned exactly a string or number literal at module level (structural: `NAME = "..."`,
    # `NAME = 10`; an f-string, call, env read or parameter is not) and never written in the enclosing function
    # (no assignment, `+=`, loop target or `global NAME`). Any other identifier is reported.
    # Schema migrations are not request code.
    paths:
      exclude:
        - "**/migrations/**"
        - "**/alembic/versions/**"
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." % ...)
          - pattern: $CUR.execute("..." + ...)
          - pattern: $CUR.execute(f"...")
      - pattern-either:
          # A lower-case or mixed-case name, attribute, call or subscript operand.
          - patterns:
              - pattern: $CUR.execute(<... $X ...>, ...)
              - metavariable-regex:
                  metavariable: $X
                  regex: ^(?![A-Z][A-Z0-9_]*$)(?!(?:None|True|False)$)[A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*|\[[^]]*\]|\([^)]*\))*$
          # An UPPER_SNAKE operand with no assignment in scope.
          - patterns:
              - pattern: $CUR.execute(<... $C ...>, ...)
              - metavariable-regex:
                  metavariable: $C
                  regex: ^[A-Z][A-Z0-9_]*$
              - pattern-not-inside: |
                  $C = $ANY_VALUE
                  ...
          # Fix round 1: an UPPER_SNAKE operand written anywhere in the enclosing function (assigned in any nested
          # block, before or after the query, augmented, a loop target or declared global) is not the module constant.
          - patterns:
              - pattern-inside: |
                  def $FUNC(...):
                    $...BODY
              - pattern: $CUR.execute(<... $C ...>, ...)
              - metavariable-regex:
                  metavariable: $C
                  regex: ^[A-Z][A-Z0-9_]*$
              - metavariable-pattern:
                  metavariable: $...BODY
                  pattern-either:
                    - pattern: $C = $W
                    - pattern: $C += $W
                    - pattern: global $C
                    - pattern: |
                        for $C in $W:
                          ...
          # Fix round 2: a read inside a nested def or lambda of a function that assigns an UPPER_SNAKE name later.
          # Python binds the closure late, so the later write is what the query reads. Opengrep resolves the name
          # before the write is seen and cannot equate the two, so any later UPPER_SNAKE write counts.
          - patterns:
              - pattern-either:
                  - patterns:
                      - pattern-inside: |
                          def $FUNC(...):
                            ...
                            def $INNER(...):
                              ...
                            ...
                            $LATER = $LW
                            ...
                      - pattern-inside: |
                          def $INNER(...):
                            ...
                  # Fix round 3: any lambda (with or without parameters, assigned or passed to a call).
                  - patterns:
                      - pattern-inside: |
                          def $FUNC(...):
                            ...
                            <... lambda $...LARGS: $LBODY ...>
                            ...
                            $LATER = $LW
                            ...
                      - pattern-inside: |
                          lambda $...LARGS: $LBODY
              - pattern: $CUR.execute(<... $C ...>, ...)
              - metavariable-regex:
                  metavariable: $C
                  regex: ^[A-Z][A-Z0-9_]*$
              - metavariable-regex:
                  metavariable: $LATER
                  regex: ^[A-Z][A-Z0-9_]*$
          # An UPPER_SNAKE operand assigned anything but a string or number literal.
          - patterns:
              - pattern-inside: |
                  $C = $V
                  ...
              - pattern: $CUR.execute(<... $C ...>, ...)
              - metavariable-regex:
                  metavariable: $C
                  regex: ^[A-Z][A-Z0-9_]*$
              - metavariable-pattern:
                  metavariable: $V
                  patterns:
                    - pattern: $VALUE
                    - pattern-not: |
                        "..."
                    - pattern-not-regex: \A-?[0-9][0-9_]*(?:\.[0-9_]+)?\Z

  - id: ci-baseline-command-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Potential command injection: untrusted data is passed to a shell-executing
      API built from a string. Use a process API with an argument array.
    metadata:
      cwe: "CWE-77: Improper Neutralization of Special Elements used in a Command ('Command Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $CP.exec("..." + ...)
          - pattern: $CP.exec(`...${...}...`)
          - pattern: $CP.execSync("..." + ...)
          - pattern: $CP.execSync(`...${...}...`)

  - id: ci-baseline-command-injection-python
    languages: [python]
    # 4.1 M9 fresh-set gate (Ruling 3): 4 hits, none true (app-defined paths, documentation samples); low severity, low confidence.
    severity: INFO
    message: >
      Potential command injection: a shell command is built from non-literal data
      with shell=True. Pass an argument list and avoid shell=True.
    metadata:
      cwe: "CWE-77: Command Injection"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: LOW
    patterns:
      - pattern-either:
          - pattern: subprocess.$F("..." + ..., shell=True)
          - pattern: subprocess.$F(f"...", shell=True)
          - pattern: os.system("..." + ...)
          - pattern: os.system(f"...")

  - id: ci-baseline-dangerous-eval
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Dynamic code evaluation of a non-literal value can lead to code injection.
      Avoid evaluating runtime-constructed code.
    metadata:
      cwe: "CWE-94: Improper Control of Generation of Code ('Code Injection')"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: eval($X)
          - pattern: new Function(..., $X)
      - pattern-not: eval("...")
      # Precision pass (design 10.6): a Function built only from string literals (for example the
      # ESM import shim new Function('s', 'return import(s)')) runs author-written code.
      - pattern-not: new Function("...")
      - pattern-not: new Function("...", "...")
      - pattern-not: new Function("...", "...", "...")
      - pattern-not: new Function("...", "...", "...", "...")

  - id: ci-baseline-nosql-injection
    languages: [javascript, typescript]
    severity: WARNING
    message: >
      Potential NoSQL injection: a MongoDB-style query filter takes a request body or
      query-string value that can be an object (such as {"$ne": null}). Cast the value to the
      expected type or validate it before it reaches the filter.
    metadata:
      cwe: "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: LOW
    # Precision pass (design 10.6): the field hits were a SQL query builder's find({ id: ... }), not
    # MongoDB. The filter must now belong to a Mongoose-style model (a capitalised receiver) or a
    # driver collection, or sit in a file that imports mongoose or mongodb. Route parameters
    # (req.params) are always strings, so they cannot carry an operator object.
    patterns:
      - pattern-either:
          - patterns:
              - pattern: '$COL.$FIND({ ..., $FIELD: req.$SRC.$NAME, ... }, ...)'
              - metavariable-regex:
                  metavariable: $COL
                  regex: ^[A-Z][A-Za-z0-9_]*$
          - pattern: '$DB.collection(...).$FIND({ ..., $FIELD: req.$SRC.$NAME, ... }, ...)'
          - patterns:
              - pattern: '$COL.$FIND({ ..., $FIELD: req.$SRC.$NAME, ... }, ...)'
              - pattern-either:
                  - pattern-inside: |
                      import $M from "mongoose";
                      ...
                  - pattern-inside: |
                      import { ... } from "mongodb";
                      ...
                  - pattern-inside: |
                      $M = require("mongoose");
                      ...
                  - pattern-inside: |
                      $M = require("mongodb");
                      ...
      - metavariable-regex:
          metavariable: $FIND
          regex: ^(find|findOne|findOneAndUpdate|findOneAndDelete|updateOne|updateMany|deleteOne|deleteMany|countDocuments|exists)$
      - metavariable-regex:
          metavariable: $SRC
          regex: ^(body|query)$

  - id: ci-baseline-path-traversal
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Potential path traversal: a filesystem path is built from request input.
      Resolve and validate the path against an allowed base directory.
    metadata:
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp: "A01:2021 - Broken Access Control"
      category: security
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $FS.readFile($P + ..., ...)
          - pattern: $FS.readFileSync($P + ...)
          - pattern: $FS.createReadStream($P + ...)
      - metavariable-pattern:
          metavariable: $P
          patterns:
            - pattern-either:
                - pattern: req.$ANY.$NAME
                - pattern: $REQ.query
                - pattern: $REQ.params
